---
name: pre-commit

on:
  push:
  pull_request:
    branches: [main]

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    container:
      image: quay.io/redhat-artifact-storage/pre-commit-image@sha256:d1b4f6df57a2dcfb97c037b9a92ae6339c007935ebab3adf8d81cbfd42c53818

    steps:
      - name: Repository checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run pre-commit hooks
        uses: pre-commit/action@v3.0.1
        env:
          SKIP: shellcheck,pylint
        with:
          extra_args: --from-ref origin/main --to-ref HEAD
